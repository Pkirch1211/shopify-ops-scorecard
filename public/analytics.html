<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Analytics — LifeLines</title>
<style>
@import url('https://api.fontshare.com/v2/css?f[]=satoshi@400,500,700&display=swap');
:root{--bg:#f0f0eb;--surface:#f7f7f3;--surface2:#e8e8e3;--border:#d4d4cc;--border2:#c8c8c0;--text:#2a2a28;--muted:#6b6b64;--dim:#9a9a92;--green:#4a6741;--green-bg:#4a6741;--green-light:#e8ede7;--dtc:#3d5c8a;--warn:#8a5c2a;--danger:#8a2a2a;--sans:'Satoshi',sans-serif;--shadow:0 1px 3px rgba(0,0,0,0.07)}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:var(--sans);font-size:14px;min-height:100vh}
header{position:sticky;top:0;z-index:100;display:grid;grid-template-columns:auto 1fr auto;align-items:stretch;border-bottom:2px solid var(--border);background:var(--surface)}
.header-brand{background:var(--green-bg);color:#fff;padding:14px 22px;display:flex;flex-direction:column;justify-content:center}
.brand-name{font-size:15px;font-weight:700;letter-spacing:.12em;text-transform:uppercase}
.brand-sub{font-size:9px;letter-spacing:.14em;text-transform:uppercase;opacity:.65;margin-top:2px}
.header-title{padding:14px 24px;display:flex;flex-direction:column;justify-content:center;border-right:1px solid var(--border)}
.header-title h1{font-size:15px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.header-title p{font-size:10px;color:var(--muted);margin-top:3px;letter-spacing:.05em}
.header-right{display:flex;align-items:center;gap:20px;padding:0 24px}
nav{display:flex;gap:3px}
.nav-link{font-size:10px;letter-spacing:.1em;text-transform:uppercase;padding:6px 14px;border:1px solid transparent;border-radius:2px;text-decoration:none;color:var(--muted);transition:all .12s}
.nav-link:hover{color:var(--text);border-color:var(--border2)}
.nav-link.active{color:var(--green);border-color:var(--green);background:var(--green-light)}

/* selector bar */
.selector-bar{background:var(--surface2);border-bottom:1px solid var(--border);padding:14px 28px 16px}
.sel-row{display:flex;gap:14px;flex-wrap:wrap;align-items:flex-start;max-width:1400px;margin:0 auto}
.sel{display:flex;flex-direction:column;gap:5px;min-width:120px}
.sel.grow{flex:1 1 300px}
.sel.sku{flex:1 1 240px}
.sel label{font-size:10px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.sel select,.sel input[type=text],.sel input[type=date]{width:100%;background:#fff;border:1px solid var(--border2);color:var(--text);font-family:var(--sans);font-size:13px;padding:8px 10px;border-radius:2px;outline:none;height:36px}
.sel select:focus,.sel input:focus{border-color:var(--green)}
.sel-dates{display:none;gap:8px;align-items:flex-end}
.sel-dates.show{display:flex}
.sel-dates .sel{min-width:130px}
.sel-actions{margin-left:auto;align-self:flex-end;display:flex;align-items:center;gap:12px}
.status{font-size:10px;color:var(--dim);white-space:nowrap}
.btn{font-family:var(--sans);font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;padding:0 14px;height:36px;border-radius:2px;cursor:pointer;background:var(--surface);color:var(--green);border:1px solid var(--green)}
.btn:hover{background:var(--green-light)}
.combo{position:relative}
.combo-list{position:absolute;left:0;right:0;top:100%;z-index:50;background:#fff;border:1px solid var(--green);border-top:none;max-height:280px;overflow-y:auto;display:none;box-shadow:0 4px 10px rgba(0,0,0,.1)}
.combo-item{padding:8px 11px;cursor:pointer;display:flex;justify-content:space-between;gap:10px;border-bottom:1px solid var(--surface2);font-size:13px}
.combo-item:last-child{border-bottom:none}
.combo-item.hl,.combo-item:hover{background:var(--green-light)}
.combo-item .sub{font-size:11px;color:var(--dim);white-space:nowrap}
.combo-empty{padding:10px 11px;font-size:12px;color:var(--dim)}
.combo-head{padding:7px 11px;font-size:9px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);background:var(--surface2);border-bottom:1px solid var(--border)}
.combo-item.idle{color:var(--muted)}
.combo-item .meta{font-size:11px;color:var(--green);white-space:nowrap;font-variant-numeric:tabular-nums}
.combo-item.idle .meta{color:var(--dim)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips:empty{display:none}
.chip{background:var(--green-light);border:1px solid var(--green);color:var(--green);font-size:12px;font-weight:500;padding:3px 5px 3px 9px;border-radius:2px;display:inline-flex;align-items:center;gap:6px}
.chip button{background:none;border:none;color:var(--green);font-size:15px;line-height:1;cursor:pointer}

main{padding:24px 28px 48px;max-width:1400px;margin:0 auto}
.error-banner{background:#f5e0e0;border:1px solid #d49696;color:var(--danger);font-size:12px;line-height:1.5;padding:10px 16px;border-radius:2px;margin-bottom:16px;display:none}
.state-panel{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:70px 40px;gap:10px;text-align:center}
.state-title{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--text)}
.state-sub{font-size:13px;color:var(--muted);max-width:380px;line-height:1.6}
.spinner{width:16px;height:16px;border:2px solid var(--border2);border-top-color:var(--green);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

.result-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.result-title{font-size:20px;font-weight:700;letter-spacing:.01em}
.result-sub{font-size:11px;color:var(--dim)}

.kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--border);border-radius:3px;overflow:hidden;background:var(--border);gap:1px;box-shadow:var(--shadow)}
.kpi-card{background:var(--surface);padding:18px 20px}
.kpi-card.primary{background:var(--green-light)}
.kpi-label{font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:10px}
.kpi-card.primary .kpi-label{color:var(--green);font-weight:700}
.kpi-units{font-size:30px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.kpi-units small{font-size:11px;font-weight:500;color:var(--muted);margin-left:5px}
.kpi-money{font-size:17px;font-weight:700;margin-top:8px;color:var(--green);font-variant-numeric:tabular-nums}
.kpi-hint{font-size:11px;color:var(--muted);margin-top:8px}

.section-header{display:flex;align-items:center;gap:10px;margin:28px 0 12px}
.section-dot{width:6px;height:6px;border-radius:50%;background:var(--green);flex-shrink:0}
.section-title{font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
.section-line{flex:1;height:1px;background:var(--border)}
.toggle{font-size:11px;color:var(--muted);display:inline-flex;align-items:center;gap:6px;cursor:pointer;white-space:nowrap}
.toggle input{accent-color:var(--green)}
.sku-block{margin-bottom:22px}
.sku-block-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:8px;flex-wrap:wrap}
.sku-block-title{font-size:13px;font-weight:700}
.sku-block-title span{font-weight:400;color:var(--muted)}

.tbl-wrap{border:1px solid var(--border);border-radius:3px;overflow-x:auto;background:var(--surface);box-shadow:var(--shadow);margin-bottom:6px}
table{width:100%;border-collapse:separate;border-spacing:0;font-size:13px}
th{background:var(--surface2);text-align:right;font-size:9px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:10px 12px;border-bottom:1px solid var(--border);white-space:nowrap;cursor:pointer;user-select:none}
th:hover{color:var(--text)}
th.sorted{color:var(--green)}
th:first-child,td:first-child{text-align:left}
th.dsep,td.dsep{border-left:2px solid var(--border2)}
td{padding:10px 12px;border-bottom:1px solid var(--border);text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
th:first-child,td:first-child{position:sticky;left:0;z-index:2;min-width:150px}
td:first-child{background:var(--surface);white-space:normal}
tr.main{cursor:pointer}
tr.main:hover td{background:#eeeee9}
tr.total td{font-weight:700;background:var(--surface2);border-bottom:none}
td .name{font-weight:700;display:block;text-align:left}
td .desc{font-size:11px;color:var(--muted);display:block;text-align:left;font-weight:400}
td.strong{font-weight:700;color:var(--green)}
td.zero{color:var(--dim)}
tr.detail{display:none}
tr.detail.show{display:table-row}
tr.detail td{background:#fff;text-align:left;padding:0;white-space:normal}
tr.detail td:first-child{position:static}
.detail-inner{position:sticky;left:0;width:min(900px,calc(100vw - 58px));padding:6px 14px 10px 28px}
.drow{display:grid;grid-template-columns:70px 90px 100px 1fr 190px;gap:10px;padding:5px 0;font-size:12px;border-bottom:1px dashed var(--border)}
.drow:last-child{border-bottom:none}
.d-qty{text-align:right;font-variant-numeric:tabular-nums}
.badge{font-size:9px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:2px 6px;border-radius:2px;align-self:center;text-align:center}
.badge.draft{background:#f3ead9;color:var(--warn)}
.badge.order{background:var(--green-light);color:var(--green)}
.note{font-size:11px;color:var(--muted);line-height:1.6;margin-top:22px;padding:12px 14px;border-left:3px solid var(--warn);background:#f3ead9;max-width:1100px}
.empty{padding:36px;text-align:center;color:var(--dim);font-size:13px}

@media(max-width:960px){.kpi-grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:640px){
  header{grid-template-columns:1fr;position:static}
  .header-brand{padding:10px 16px}
  .header-title{padding:10px 16px;border-right:none;border-bottom:1px solid var(--border)}
  .header-right{padding:10px 16px}
  nav{flex-wrap:wrap;gap:4px}
  .nav-link{font-size:9px;padding:5px 9px}
  .selector-bar{padding:12px 14px 14px}
  .sel,.sel.grow,.sel.sku{flex:1 1 100%}
  .sel-actions{margin-left:0}
  main{padding:14px 14px 32px}
  .kpi-card{padding:14px 14px}
  .kpi-units{font-size:24px}
  th,td{padding:9px 10px}
  th:first-child,td:first-child{min-width:120px}
  .result-title{font-size:17px}
  .drow{grid-template-columns:60px 80px 1fr}
  .drow .d-title,.drow .d-qty{grid-column:1 / -1;text-align:left}
}
</style>
</head>
<body>
<header>
  <div class="header-brand"><div class="brand-name">LifeLines</div><div class="brand-sub">Ops Tools</div></div>
  <div class="header-title"><h1>Analytics</h1><p>B2B Customer &amp; SKU Order Summary</p></div>
  <div class="header-right">
    <nav>
      <a href="/" class="nav-link">Scorecard</a>
      <a href="/dtc.html" class="nav-link">DTC</a>
      <a href="/b2b.html" class="nav-link">B2B</a>
      <a href="/npi.html" class="nav-link">NPI</a>
      <a href="/care.html" class="nav-link">Care@</a>
      <a href="/draft-health.html" class="nav-link">Order Engine</a>
      <a href="/analytics.html" class="nav-link active">Analytics</a>
    </nav>
  </div>
</header>

<div class="selector-bar">
  <div class="sel-row">
    <div class="sel" style="flex:0 0 130px">
      <label for="viewBy">View by</label>
      <select id="viewBy">
        <option value="customer">Customer</option>
        <option value="sku">SKU</option>
      </select>
    </div>

    <div class="sel grow">
      <label for="custInput" id="custLabel">Customer</label>
      <div class="combo">
        <input type="text" id="custInput" placeholder="Loading customers…" autocomplete="off" disabled>
        <div class="combo-list" id="comboList"></div>
      </div>
      <div class="chips" id="chips"></div>
    </div>

    <div class="sel sku">
      <label for="skuInput" id="skuLabel">Filter SKUs (optional)</label>
      <input type="text" id="skuInput" placeholder="Paste SKUs, e.g. LL-16-3366, LL-16-3369" autocomplete="off">
    </div>

    <div class="sel" style="flex:0 0 170px">
      <label for="period">Fulfilled period</label>
      <select id="period">
        <option value="ytd">Year to date</option>
        <option value="90d">Last 90 days</option>
        <option value="12m">Last 12 months</option>
        <option value="custom">Custom range…</option>
      </select>
    </div>

    <div class="sel-dates" id="customDates">
      <div class="sel"><label for="fromDate">From</label><input type="date" id="fromDate"></div>
      <div class="sel"><label for="toDate">To</label><input type="date" id="toDate"></div>
    </div>

    <div class="sel-actions">
      <span class="status" id="status"></span>
      <button class="btn" id="csvBtn" type="button" style="display:none">Export CSV</button>
    </div>
  </div>
</div>

<main>
  <div class="error-banner" id="errorBanner"></div>
  <div id="results"></div>
</main>

<script>
var view = 'customer';          // 'customer' | 'sku'
var directory = [];             // [{key,label,ids,emails}]
var idToEntry = {};             // numeric id -> directory entry
var selected = [];              // selected directory entries
var lastData = null;            // last query response
var lastReqSkus = [];
var groupsStore = [];           // groups for detail toggling
var hlIndex = -1, matches = [];
var sortState = { key: null, dir: 'desc' };
var runId = 0, runTimer = null;
var fulPending = false, fulError = '';   // fulfilled history loads after the open numbers

function $(id) { return document.getElementById(id); }
function esc(s) { return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function num(n) { return (n || 0).toLocaleString('en-US'); }
function usd(n) { return '$' + Math.round(n || 0).toLocaleString('en-US'); }
function usdK(n) {
  n = n || 0;
  if (n >= 1e6) return '$' + (n / 1e6).toFixed(1).replace(/\.0$/, '') + 'M';
  if (n >= 1e3) return '$' + Math.round(n / 1e3) + 'k';
  return '$' + Math.round(n);
}
function plural(n, one, many) { return n + ' ' + (n === 1 ? one : (many || one + 's')); }
function ymd(d) { return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
function fmtDate(s) { return new Date(s + 'T00:00:00').toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' }); }

// JSON fetch that explains itself when the server answers with a web page.
async function api(url, opts) {
  var res = await fetch(url, opts);
  var text = await res.text();
  var data;
  try { data = JSON.parse(text); }
  catch (e) {
    throw new Error('The server returned a web page instead of data (HTTP ' + res.status + ' from ' + url + '). ' +
      'The Analytics endpoints are probably not installed: check that analytics.js is deployed and server.js has the ' +
      'require("./analytics") line, then open /api/analytics/ping — it should show {"ok":true}.');
  }
  if (!res.ok) throw new Error(data.error || ('Server error (HTTP ' + res.status + ')'));
  return data;
}

// ── Setup ────────────────────────────────────────────────────────────────────
(function init() {
  var now = new Date();
  $('fromDate').value = now.getFullYear() + '-01-01';
  $('toDate').value = ymd(now);
  $('viewBy').onchange = function() { setView($('viewBy').value); };
  $('period').onchange = function() {
    $('customDates').classList.toggle('show', $('period').value === 'custom');
    if ($('period').value !== 'custom') schedule();
  };
  $('fromDate').onchange = schedule;
  $('toDate').onchange = schedule;
  $('skuInput').addEventListener('change', schedule);
  $('skuInput').addEventListener('keydown', function(e) { if (e.key === 'Enter') { e.preventDefault(); schedule(); } });
  $('csvBtn').onclick = exportCsv;
  $('results').addEventListener('click', onResultsClick);
  $('results').addEventListener('change', function(e) { if (e.target.id === 'splitToggle') { splitView = e.target.checked; render(); } });
  wireCombo();
  renderEmpty();
  loadDirectory();
})();

var splitView = false;

function setView(v) {
  view = v;
  if (v === 'customer') {
    $('custLabel').textContent = 'Customer';
    $('skuLabel').textContent = 'Filter SKUs (optional)';
    $('skuInput').placeholder = 'Paste SKUs, e.g. LL-16-3366, LL-16-3369';
  } else {
    $('custLabel').textContent = 'Customer (optional)';
    $('skuLabel').textContent = 'SKUs';
    $('skuInput').placeholder = 'Paste one or more SKUs from the email';
  }
  sortState = { key: null, dir: 'desc' };
  lastData = null;
  $('csvBtn').style.display = 'none';
  schedule();
}

async function loadDirectory() {
  try {
    var data = await api('/api/analytics/customers');
    directory = (data.customers || []).map(function(c) {
      c.hay = (c.label + ' ' + (c.members || []).join(' ') + ' ' + (c.emails || []).join(' ')).toLowerCase();
      c.ids.forEach(function(id) { idToEntry[id] = c; });
      return c;
    });
    $('custInput').disabled = false;
    var active = directory.filter(isActive).length;
    $('custInput').placeholder = 'Type a company name…  (' + active.toLocaleString() + ' active this year, ' + directory.length.toLocaleString() + ' total)';
  } catch (err) {
    $('custInput').placeholder = 'Customer list unavailable';
    showError('Could not load customers: ' + err.message);
  }
}

// ── Fuzzy combobox ───────────────────────────────────────────────────────────
function fuzzy(q, s) {
  var toks = q.split(/\s+/).filter(Boolean), total = 0;
  for (var t = 0; t < toks.length; t++) {
    var tok = toks[t], i = s.indexOf(tok);
    if (i >= 0) {
      total += 100 - Math.min(i, 50) + ((i === 0 || s.charAt(i - 1) === ' ') ? 20 : 0);
    } else {
      var p = 0, last = -1, gaps = 0;
      for (var c = 0; c < tok.length; c++) {
        var j = s.indexOf(tok.charAt(c), p);
        if (j < 0) return 0;
        if (last >= 0) gaps += j - last - 1;
        last = j; p = j + 1;
      }
      if (gaps > tok.length * 2) return 0;
      total += Math.max(1, 30 - gaps);
    }
  }
  return total;
}

function wireCombo() {
  var input = $('custInput'), list = $('comboList');
  input.addEventListener('input', renderCombo);
  input.addEventListener('focus', renderCombo);
  input.addEventListener('keydown', function(e) {
    if (e.key === 'ArrowDown') { e.preventDefault(); moveHl(1); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); moveHl(-1); }
    else if (e.key === 'Enter') { if (hlIndex >= 0 && matches[hlIndex]) { e.preventDefault(); pick(matches[hlIndex]); } }
    else if (e.key === 'Escape') { list.style.display = 'none'; }
  });
  list.addEventListener('mousedown', function(e) {
    var el = e.target.closest('.combo-item');
    if (el) { e.preventDefault(); pick(matches[parseInt(el.getAttribute('data-i'), 10)]); }
  });
  document.addEventListener('click', function(e) {
    if (!e.target.closest('.combo')) list.style.display = 'none';
  });
  $('chips').addEventListener('click', function(e) {
    var b = e.target.closest('button[data-key]');
    if (!b) return;
    selected = selected.filter(function(c) { return c.key !== b.getAttribute('data-key'); });
    renderChips();
    schedule();
  });
}

function isActive(c) { return (c.ytd || 0) > 0 || (c.drafts || 0) > 0; }

function locNote(c) { return c.locations > 1 ? c.locations + ' locations · ' : ''; }

function comboMeta(c) {
  if (c.ytd > 0 && c.locations > 1) return locNote(c) + usdK(c.ytd) + ' YTD · ' + plural(c.ytdOrders, 'order');
  if (c.ytd > 0) return usdK(c.ytd) + ' YTD · ' + plural(c.ytdOrders, 'order');
  if (c.drafts > 0) return locNote(c) + plural(c.drafts, 'open draft');
  return locNote(c) + 'no orders this year';
}

function renderCombo() {
  var q = $('custInput').value.trim().toLowerCase(), list = $('comboList');
  var chosen = {};
  selected.forEach(function(c) { chosen[c.key] = true; });
  var pool = directory.filter(function(c) { return !chosen[c.key]; });
  var head = '';
  if (!q) {
    // Nothing typed: show who's actually buying this year, biggest first.
    matches = pool.filter(isActive)
      .sort(function(a, b) { return (b.ytd || 0) - (a.ytd || 0) || (b.drafts || 0) - (a.drafts || 0); })
      .slice(0, 15);
    if (matches.length) head = '<div class="combo-head">Top customers this year · type to search all ' + directory.length.toLocaleString() + '</div>';
    else matches = pool.slice(0, 15);   // no volume data available: fall back to A–Z
  } else {
    // Typing: best text match wins, with a nudge toward customers that buy.
    matches = pool
      .map(function(c) {
        var s = fuzzy(q, c.hay);
        if (s > 0 && c.ytd > 0) s += Math.min(25, Math.log10(c.ytd + 1) * 4);
        else if (s > 0 && c.drafts > 0) s += 5;
        return { c: c, s: s };
      })
      .filter(function(x) { return x.s > 0; })
      .sort(function(a, b) { return b.s - a.s; })
      .slice(0, 15).map(function(x) { return x.c; });
  }
  hlIndex = matches.length ? 0 : -1;
  list.innerHTML = matches.length
    ? head + matches.map(function(c, i) {
        return '<div class="combo-item' + (i === 0 ? ' hl' : '') + (isActive(c) ? '' : ' idle') + '" data-i="' + i + '"><span>' + esc(c.label) + '</span>' +
          '<span class="meta">' + esc(comboMeta(c)) + '</span></div>';
      }).join('')
    : '<div class="combo-empty">No matching customers</div>';
  list.style.display = 'block';
}

function moveHl(d) {
  if (!matches.length) return;
  hlIndex = (hlIndex + d + matches.length) % matches.length;
  var items = $('comboList').querySelectorAll('.combo-item');
  items.forEach(function(el, i) { el.classList.toggle('hl', i === hlIndex); });
  if (items[hlIndex]) items[hlIndex].scrollIntoView({ block: 'nearest' });
}

function pick(c) {
  if (!c) return;
  selected.push(c);
  $('custInput').value = '';
  $('comboList').style.display = 'none';
  renderChips();
  schedule();
}

function renderChips() {
  $('chips').innerHTML = selected.map(function(c) {
    return '<span class="chip">' + esc(c.label) + '<button type="button" data-key="' + esc(c.key) + '" aria-label="Remove ' + esc(c.label) + '">&times;</button></span>';
  }).join('');
}

// ── Query ────────────────────────────────────────────────────────────────────
function parseSkus(text) {
  var found = (text.match(/[A-Za-z0-9]+(?:-[A-Za-z0-9]+)+/g) || []).map(function(s) { return s.toUpperCase(); });
  if (!found.length) {
    found = text.split(/[\s,;]+/).filter(function(s) { return /\d/.test(s); }).map(function(s) { return s.toUpperCase(); });
  }
  return found.filter(function(s, i) { return found.indexOf(s) === i; });
}

function periodRange() {
  var p = $('period').value, now = new Date(), to = ymd(now), from;
  if (p === 'ytd') from = now.getFullYear() + '-01-01';
  else if (p === '90d') { var d = new Date(now); d.setDate(d.getDate() - 90); from = ymd(d); }
  else if (p === '12m') { var d2 = new Date(now); d2.setFullYear(d2.getFullYear() - 1); from = ymd(d2); }
  else { from = $('fromDate').value || (now.getFullYear() + '-01-01'); to = $('toDate').value || to; }
  return { from: from, to: to };
}

function schedule() {
  clearTimeout(runTimer);
  runTimer = setTimeout(maybeRun, 200);
}

function maybeRun() {
  var skus = parseSkus($('skuInput').value);
  var ready = view === 'customer' ? selected.length > 0 : skus.length > 0;
  hideError();
  if (!ready) {
    runId++;                       // drop any request still in flight
    lastData = null;
    fulPending = false; fulError = '';
    $('csvBtn').style.display = 'none';
    $('status').textContent = '';
    renderEmpty();
    return;
  }
  runQuery(skus);
}

// One order can show up in both halves (a partly shipped order); fold them back together.
function mergeRecords(list) {
  var map = {}, out = [];
  list.forEach(function(r) {
    var k = r.type + '|' + r.name + '|' + r.sku + '|' + r.customerId;
    if (!map[k]) { map[k] = Object.assign({}, r); out.push(map[k]); }
    else {
      var m = map[k];
      m.open += r.open; m.fulfilled += r.fulfilled;
      m.openValue = Math.round(((m.openValue || 0) + (r.openValue || 0)) * 100) / 100;
      m.fulfilledValue = Math.round(((m.fulfilledValue || 0) + (r.fulfilledValue || 0)) * 100) / 100;
    }
  });
  return out;
}

async function runQuery(skus) {
  var my = ++runId;
  var ids = [];
  selected.forEach(function(c) { ids = ids.concat(c.ids); });
  var r = periodRange();
  lastReqSkus = skus;
  lastData = null;
  fulPending = true; fulError = '';
  $('csvBtn').style.display = 'none';
  $('status').textContent = 'Searching drafts and orders…';
  $('results').innerHTML = '<div class="state-panel"><div class="spinner"></div><div class="state-sub">Searching drafts and orders…</div></div>';

  function req(phase) {
    return api('/api/analytics/query', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ customerIds: ids, skus: skus, from: r.from, to: r.to, phase: phase }),
    });
  }
  // Both halves start now; the open half finishes first and paints immediately.
  var fulP = req('fulfilled');
  fulP.catch(function() {});         // handled below; avoids an unhandled rejection if open fails first
  try {
    var open = await req('open');
    if (my !== runId) return;
    lastData = { asOf: open.asOf, range: open.range, records: open.records };
    render();
    $('status').textContent = 'Open orders loaded · loading fulfilled history…';
  } catch (err) {
    if (my !== runId) return;
    fulPending = false;
    showError(err.message);
    $('status').textContent = '';
    renderEmpty();
    return;
  }
  try {
    var ful = await fulP;
    if (my !== runId) return;
    lastData.records = mergeRecords(lastData.records.concat(ful.records));
  } catch (err) {
    if (my !== runId) return;
    fulError = err.message;
    showError('Fulfilled history could not load: ' + err.message);
  }
  fulPending = false;
  render();
  $('status').textContent = 'As of ' + new Date(lastData.asOf).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) +
    (fulError ? ' · fulfilled unavailable' : '');
  $('csvBtn').style.display = lastData.records.length ? 'inline-block' : 'none';
}

// ── Rendering ────────────────────────────────────────────────────────────────
function renderEmpty() {
  var t = view === 'customer' ? 'Pick a customer' : 'Enter SKUs';
  var s = view === 'customer'
    ? 'Choose one or more customers above to see what they have on order, SKU by SKU.'
    : 'Paste one or more SKUs above to see which customers have them on order.';
  $('results').innerHTML = '<div class="state-panel"><div class="state-title">' + t + '</div><div class="state-sub">' + s + '</div></div>';
}

function companyOf(r) {
  var e = idToEntry[r.customerId];
  return e ? { key: e.key, label: e.label, locations: e.locations } : { key: 'x:' + r.label.toLowerCase(), label: r.label };
}

// Order counts are distinct drafts/orders, never summed across rows, because
// one order can carry several SKUs.
function totals(recs) {
  var a = { drafts: 0, unf: 0, ful: 0, total: 0, draftsV: 0, unfV: 0, fulV: 0, totalV: 0 };
  var od = {}, oo = {}, of = {};
  recs.forEach(function(r) {
    if (r.type === 'draft') { a.drafts += r.open; a.draftsV += r.openValue || 0; if (r.open) od[r.name] = 1; }
    else { a.unf += r.open; a.unfV += r.openValue || 0; if (r.open) oo[r.name] = 1; }
    a.ful += r.fulfilled; a.fulV += r.fulfilledValue || 0;
    if (r.fulfilled) of[r.name] = 1;
  });
  a.total = a.drafts + a.unf;
  a.totalV = a.draftsV + a.unfV;
  a.nDrafts = Object.keys(od).length;
  a.nUnf = Object.keys(oo).length;
  a.orders = a.nDrafts + a.nUnf;
  a.nFul = Object.keys(of).length;
  return a;
}

function cols() {
  if (splitView) return [
    { k: 'drafts', h: 'Draft units', f: num },
    { k: 'unf', h: 'Unfulfilled units', f: num },
    { k: 'total', h: 'Open units', f: num, strong: true },
    { k: 'ful', h: 'Fulfilled units', f: num },
    { k: 'draftsV', h: 'Draft $', f: usd, sep: true },
    { k: 'unfV', h: 'Unfulfilled $', f: usd },
    { k: 'totalV', h: 'Open $', f: usd, strong: true },
    { k: 'fulV', h: 'Fulfilled $', f: usd },
    { k: 'orders', h: 'Orders', f: num, sep: true },
  ];
  return [
    { k: 'total', h: 'Open units', f: num, strong: true },
    { k: 'totalV', h: 'Open $', f: usd, strong: true },
    { k: 'orders', h: 'Orders', f: num },
    { k: 'ful', h: 'Fulfilled units', f: num, sep: true },
    { k: 'fulV', h: 'Fulfilled $', f: usd },
  ];
}

function tile(label, units, money, hint, primary, state) {
  // state: 'loading' | 'error' for the Fulfilled tile while its history is still coming in
  if (state) {
    return '<div class="kpi-card"><div class="kpi-label">' + label + '</div>' +
      '<div class="kpi-units" style="color:var(--dim)">' + (state === 'loading' ? '…' : '—') + '</div>' +
      '<div class="kpi-money" style="color:var(--dim)">&nbsp;</div>' +
      '<div class="kpi-hint">' + (state === 'loading' ? 'loading fulfilled history…' : 'could not load') + '</div></div>';
  }
  return '<div class="kpi-card' + (primary ? ' primary' : '') + '"><div class="kpi-label">' + label + '</div>' +
    '<div class="kpi-units">' + num(units) + '<small>units</small></div>' +
    '<div class="kpi-money">' + usd(money) + '</div>' +
    '<div class="kpi-hint">' + hint + '</div></div>';
}

function render() {
  if (!lastData) return renderEmpty();
  var recs = lastData.records;
  groupsStore = [];
  var all = totals(recs);
  var html = '';

  var title = view === 'customer'
    ? selected.map(function(c) { return c.label; }).join(' + ')
    : (selected.length ? selected.map(function(c) { return c.label; }).join(' + ') + ' · ' : '') + lastReqSkus.join(', ');
  html += '<div class="result-head"><span class="result-title">' + esc(title) + '</span>' +
    '<span class="result-sub">Fulfilled counts orders placed ' + esc(fmtDate(lastData.range.from)) + ' – ' + esc(fmtDate(lastData.range.to)) + '</span></div>';

  html += '<div class="kpi-grid">' +
    tile('On order now', all.total, all.totalV, plural(all.orders, 'order') + ' · ' + plural(all.nDrafts, 'draft') + ', ' + all.nUnf + ' unfulfilled', true) +
    tile('Open drafts', all.drafts, all.draftsV, plural(all.nDrafts, 'draft')) +
    tile('Unfulfilled', all.unf, all.unfV, plural(all.nUnf, 'order')) +
    tile('Fulfilled', all.ful, all.fulV, plural(all.nFul, 'order'), false, fulPending ? 'loading' : (fulError ? 'error' : '')) +
    '</div>';

  html += '<div class="section-header"><span class="section-dot"></span><span class="section-title">' +
    (view === 'customer' ? 'By SKU' : 'By customer') + '</span><div class="section-line"></div>' +
    '<label class="toggle"><input type="checkbox" id="splitToggle"' + (splitView ? ' checked' : '') + '> Show draft / unfulfilled split</label></div>';

  if (view === 'customer') {
    var bySku = {}, order = [];
    lastReqSkus.forEach(function(s) { bySku[s] = { label: s, sub: '', recs: [] }; order.push(s); });
    recs.forEach(function(r) {
      if (!bySku[r.sku]) { bySku[r.sku] = { label: r.sku, sub: '', recs: [] }; order.push(r.sku); }
      bySku[r.sku].sub = bySku[r.sku].sub || r.title;
      bySku[r.sku].recs.push(r);
    });
    var groups = order.map(function(k) { return bySku[k]; });
    // Keep the pasted SKU order unless the reader clicks a column to sort.
    var useDefault = !sortState.key && !lastReqSkus.length;
    html += table('SKU', groups, false, useDefault);
  } else {
    lastReqSkus.forEach(function(s) {
      var sr = recs.filter(function(r) { return r.sku === s; });
      var byCo = {}, keys = [];
      sr.forEach(function(r) {
        var co = companyOf(r);
        if (!byCo[co.key]) { byCo[co.key] = { label: co.label, sub: co.locations > 1 ? co.locations + ' locations' : '', recs: [] }; keys.push(co.key); }
        byCo[co.key].recs.push(r);
      });
      var desc = sr.length ? sr[0].title : '';
      html += '<div class="sku-block"><div class="sku-block-head"><span class="sku-block-title">' + esc(s) +
        (desc ? ' <span>— ' + esc(desc) + '</span>' : '') + '</span><span class="result-sub">' + plural(keys.length, 'customer') + '</span></div>' +
        table('Customer', keys.map(function(k) { return byCo[k]; }), true, !sortState.key) + '</div>';
    });
  }

  html += '<div class="note"><b>Heads up:</b> This covers drafts and orders in Shopify. Orders received in MarketTime that haven\'t transferred to Shopify yet are not included. ' +
    'Open = open drafts + unfulfilled orders. Orders counts distinct drafts and orders with open units. ' +
    'Dollars are merchandise value (units × unit price after line-level discounts); order-level discounts, tax and shipping are not included, so they won\'t match invoice totals. ' +
    'Click a row to see the drafts and orders behind it, or a column heading to sort.</div>';
  $('results').innerHTML = html;
}

function sortGroups(groups, useDefault) {
  var arr = groups.map(function(g) { g.t = totals(g.recs); return g; });
  var key = sortState.key, dir = sortState.dir === 'asc' ? 1 : -1;
  if (!key) {
    if (useDefault) arr.sort(function(a, b) { return b.t.totalV - a.t.totalV || b.t.total - a.t.total; });
    return arr;
  }
  if (key === 'label') arr.sort(function(a, b) { return dir * a.label.localeCompare(b.label); });
  else arr.sort(function(a, b) { return dir * (a.t[key] - b.t[key]); });
  return arr;
}

function table(firstCol, groupsIn, hideSub, useDefault) {
  var groups = sortGroups(groupsIn, useDefault);
  var C = cols();
  var span = C.length + 1;
  var allRecs = [];
  var body = groups.map(function(g) {
    var t = g.t, gi = groupsStore.length;
    groupsStore.push(g);
    allRecs = allRecs.concat(g.recs);
    var rows = '<tr class="main" data-g="' + gi + '"><td><span class="name">' + esc(g.label) + '</span>' +
      (g.sub && !hideSub ? '<span class="desc">' + esc(g.sub) + '</span>' : '') + '</td>' +
      C.map(function(c) {
        var cls = [];
        if (c.sep) cls.push('dsep');
        var waiting = (fulPending || fulError) && (c.k === 'ful' || c.k === 'fulV');
        if (waiting || !t[c.k]) cls.push('zero'); else if (c.strong) cls.push('strong');
        return '<td' + (cls.length ? ' class="' + cls.join(' ') + '"' : '') + '>' + (waiting ? (fulPending ? '…' : '—') : c.f(t[c.k])) + '</td>';
      }).join('') + '</tr>';
    rows += '<tr class="detail" id="d' + gi + '"><td colspan="' + span + '"><div class="detail-inner">' + detail(g.recs) + '</div></td></tr>';
    return rows;
  }).join('');
  if (!groups.length) body = '<tr><td colspan="' + span + '" class="empty">Nothing on order.</td></tr>';
  var foot = '';
  if (groups.length > 1) {
    var gt = totals(allRecs);
    foot = '<tr class="total"><td>Total</td>' + C.map(function(c) {
      var waiting = (fulPending || fulError) && (c.k === 'ful' || c.k === 'fulV');
      return '<td' + (c.sep ? ' class="dsep"' : '') + '>' + (waiting ? (fulPending ? '…' : '—') : c.f(gt[c.k])) + '</td>';
    }).join('') + '</tr>';
  }
  var head = '<tr><th data-k="label" class="' + (sortState.key === 'label' ? 'sorted' : '') + '">' + esc(firstCol) + arrow('label') + '</th>' +
    C.map(function(c) {
      return '<th data-k="' + c.k + '" class="' + (c.sep ? 'dsep ' : '') + (sortState.key === c.k ? 'sorted' : '') + '">' + c.h + arrow(c.k) + '</th>';
    }).join('') + '</tr>';
  return '<div class="tbl-wrap"><table><thead>' + head + '</thead><tbody>' + body + foot + '</tbody></table></div>';
}

function arrow(k) {
  if (sortState.key !== k) return '';
  return sortState.dir === 'asc' ? ' ▲' : ' ▼';
}

function onResultsClick(e) {
  var th = e.target.closest('th[data-k]');
  if (th) {
    var k = th.getAttribute('data-k');
    if (sortState.key === k) sortState.dir = sortState.dir === 'desc' ? 'asc' : 'desc';
    else sortState = { key: k, dir: k === 'label' ? 'asc' : 'desc' };
    render();
    return;
  }
  var tr = e.target.closest('tr.main');
  if (!tr) return;
  var d = document.getElementById('d' + tr.getAttribute('data-g'));
  if (d) d.classList.toggle('show');
}

function detail(recs) {
  if (!recs.length) return '<div class="result-sub" style="padding:8px 0">No drafts or orders found.</div>';
  return recs.slice().sort(function(a, b) { return new Date(b.createdAt) - new Date(a.createdAt); }).map(function(r) {
    var parts = [];
    if (r.open) parts.push(num(r.open) + ' open · ' + usd(r.openValue));
    if (r.fulfilled) parts.push(num(r.fulfilled) + ' fulfilled · ' + usd(r.fulfilledValue));
    return '<div class="drow"><span class="badge ' + r.type + '">' + (r.type === 'draft' ? 'Draft' : 'Order') + '</span>' +
      '<span><b>' + esc(r.name) + '</b></span>' +
      '<span>' + esc(new Date(r.createdAt).toLocaleDateString()) + '</span>' +
      '<span class="d-title" style="color:var(--muted)">' + esc(r.label) + (view === 'sku' ? '' : ' · ' + esc(r.sku)) + '</span>' +
      '<span class="d-qty">' + parts.join('<br>') + '</span></div>';
  }).join('');
}

// ── Export ───────────────────────────────────────────────────────────────────
function csvEsc(v) {
  var s = String(v == null ? '' : v);
  return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
}
function exportCsv() {
  if (!lastData || !lastData.records.length) return;
  var lines = [['Type', 'Document', 'Created', 'Customer', 'SKU', 'Product', 'Open Qty', 'Open $', 'Fulfilled Qty', 'Fulfilled $'].map(csvEsc).join(',')];
  lastData.records.forEach(function(r) {
    lines.push([r.type, r.name, r.createdAt.slice(0, 10), companyOf(r).label, r.sku, r.title,
      r.open, (r.openValue || 0).toFixed(2), r.fulfilled, (r.fulfilledValue || 0).toFixed(2)].map(csvEsc).join(','));
  });
  var blob = new Blob([lines.join('\n')], { type: 'text/csv' });
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'analytics-' + new Date().toISOString().slice(0, 10) + '.csv';
  a.click();
  URL.revokeObjectURL(a.href);
}

function showError(msg) { var el = $('errorBanner'); el.textContent = 'Error: ' + msg; el.style.display = 'block'; }
function hideError() { $('errorBanner').style.display = 'none'; }
</script>
</body>
</html>
